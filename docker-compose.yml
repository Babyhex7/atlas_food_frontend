services:
  # Next.js Frontend (Atlas Food)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/api/v1}
        NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL:-}
    container_name: atlas_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - API_URL=${API_URL:-http://localhost:8080/api/v1}
      - WS_URL=${WS_URL:-ws://localhost:8080/api/v1}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/api/v1}
    networks:
      - atlas-network

networks:
  atlas-network:
    name: atlas-network
    driver: bridge
